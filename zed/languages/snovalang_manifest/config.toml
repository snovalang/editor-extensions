name = "Snovalang Manifest"
grammar = "snovalang_manifest"
path_suffixes = ["mod.sns", "snova.sns"]
line_comments = ["# "]
brackets = [
  { start = "[", end = "]", close = true, newline = false },
  { start = "{", end = "}", close = true, newline = true },
  { start = "\"", end = "\"", close = true, newline = false },
  { start = "'", end = "'", close = true, newline = false },
]
autoclose_before = ";:.,=}])> \n\t"
formatter = "none"
