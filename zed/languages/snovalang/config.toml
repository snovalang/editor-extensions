name = "Snovalang"
grammar = "snovalang"
path_suffixes = ["snl", "sns"]
tab_size = 4
hard_tabs = false
line_comments = ["// "]
block_comment = ["/*", "*/"]
brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = true },
  { start = "\"", end = "\"", close = true, newline = false },
  { start = "'", end = "'", close = true, newline = false },
]
autoclose_before = ";:.,=}])> \n\t"
formatter = "none"
