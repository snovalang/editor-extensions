id = "snovalang"
name = "Snovalang"
version = "0.3.1"
schema_version = 1
authors = ["Aggitech Team <dev@aggitech.com>"]
description = "Snovalang language support using the snova-lsp language server"
repository = "https://github.com/snovalang/editor-extensions"

[grammars.snovalang]
repository = "https://github.com/snovalang/editor-extensions"
path = "zed/tree-sitter-snovalang"
rev = "98412f8eef277f02ecc0b840cf26146d6f833e26"

[grammars.snovalang_manifest]
repository = "https://github.com/snovalang/editor-extensions"
path = "zed/tree-sitter-snovalang-manifest"
rev = "98412f8eef277f02ecc0b840cf26146d6f833e26"

[language_servers.snova_lsp]
name = "Snovalang Language Server"
languages = ["Snovalang", "Snovalang Manifest"]
