name: Package extensions

on:
  pull_request:

jobs:
  build-macos-lsp:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS LSP
        run: ./scripts/build-macos-universal-lsp.sh
      - uses: actions/upload-artifact@v4
        with:
          name: snova-lsp-macos
          path: vscode/server/snova-lsp-darwin
  package:
    runs-on: ubuntu-latest
    needs: build-macos-lsp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: actions/download-artifact@v4
        with:
          name: snova-lsp-macos
          path: vscode/server
      - name: Build Linux LSP
        run: ./scripts/build-linux-lsp.sh
      - name: Package VS Code extension
        run: ./scripts/package-vscode.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Package Zed extension
        run: ./scripts/package-zed.sh
      - name: Package JetBrains plugin
        run: ./scripts/package-jetbrains.sh
      - name: Verify JetBrains plugin against current IDE releases
        working-directory: jetbrains
        run: ./gradlew --no-daemon --console=plain verifyPlugin
      - uses: actions/upload-artifact@v4
        with:
          name: editor-extensions
          path: |
            dist/snovalang.vsix
            dist/snovalang-zed.tar.gz
            dist/snovalang-jetbrains.zip
