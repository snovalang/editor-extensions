name: Release editor extensions

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  build-macos-lsp:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS LSP
        run: ./scripts/build-macos-universal-lsp.sh
      - uses: actions/upload-artifact@v4
        with:
          name: snova-lsp-macos
          path: vscode/server/snova-lsp-darwin
  release:
    runs-on: ubuntu-latest
    needs: build-macos-lsp
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: actions/download-artifact@v4
        with:
          name: snova-lsp-macos
          path: vscode/server
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Select the next semantic version
        id: version
        run: echo "version=$(node scripts/next-release-version.mjs)" >> "$GITHUB_OUTPUT"
      # The version lives in the tag. Manifests are bumped only in this
      # workspace, so the release never pushes to the protected master branch.
      - name: Set release versions in extension manifests
        run: node scripts/set-release-version.mjs "${{ steps.version.outputs.version }}"
      - name: Build Linux LSP
        run: ./scripts/build-linux-lsp.sh
      - name: Package VS Code extension
        run: ./scripts/package-vscode.sh
      - name: Add standalone LSP binaries to the release
        run: |
          cp vscode/server/snova-lsp dist/snova-lsp-linux-x86_64
          cp vscode/server/snova-lsp.exe dist/snova-lsp-windows-x86_64.exe
          cp vscode/server/snova-lsp-darwin dist/snova-lsp-macos-universal
      - name: Package Zed extension
        run: ./scripts/package-zed.sh
      - name: Package JetBrains plugin
        run: ./scripts/package-jetbrains.sh
      - name: Create the GitHub release with editor packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ github.sha }}
        run: |
          gh release create "v${VERSION}" \
            dist/snovalang.vsix \
            dist/snovalang-zed.tar.gz \
            dist/snovalang-jetbrains.zip \
            dist/snova-lsp-linux-x86_64 \
            dist/snova-lsp-windows-x86_64.exe \
            dist/snova-lsp-macos-universal \
            --target "$TARGET" \
            --title "Snovalang v${VERSION}" \
            --generate-notes
      - name: Publish to VS Code registries when credentials exist
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -eu
          if [ -n "${VSCE_PAT}" ]; then
            npx --yes @vscode/vsce publish --packagePath dist/snovalang.vsix -p "$VSCE_PAT"
          else
            echo "VSCE_PAT is not set. Skipping the Visual Studio Marketplace."
          fi
          if [ -n "${OVSX_PAT}" ]; then
            npx --yes ovsx publish dist/snovalang.vsix -p "$OVSX_PAT"
          else
            echo "OVSX_PAT is not set. Skipping Open VSX."
          fi
      - name: Publish to JetBrains Marketplace when credentials exist
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        working-directory: jetbrains
        run: |
          set -eu
          if [ -n "${JETBRAINS_MARKETPLACE_TOKEN}" ]; then
            ./gradlew --no-daemon --console=plain publishPlugin
          else
            echo "JETBRAINS_MARKETPLACE_TOKEN is not set. Skipping JetBrains Marketplace."
          fi
